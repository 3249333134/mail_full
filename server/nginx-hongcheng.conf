# hongcheng.me -> mail 前端 (3005) 反向代理
# 80 端口：HTTP 直接反代前端（证书重签后可再加 301 跳 https）
server {
    listen 80;
    server_name hongcheng.me;

    client_max_body_size 50m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源长缓存（前端已带版本号查询参数，可放心缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp3|wav|ogg)$ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}

# 443 端口：HTTPS 反代（证书重签后生效）
server {
    listen 443 ssl http2;
    server_name hongcheng.me;

    ssl_certificate /usr/share/nginx/html/ssl/fullchain.pem;
    ssl_certificate_key /usr/share/nginx/html/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
