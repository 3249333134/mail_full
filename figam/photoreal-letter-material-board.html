<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超真实书信材质输出</title>
  <style>
    :root {
      --ink: #241b15;
      --muted: #776353;
      --paper: #f8efe1;
      --line: rgba(96, 70, 46, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 230, 174, .28), transparent 28%),
        radial-gradient(circle at 86% 4%, rgba(88, 57, 31, .12), transparent 26%),
        #eadfce;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    }

    header,
    main {
      width: min(1420px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 42px 0 22px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #a64f47;
      font: 700 11px/1.2 Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 54px);
      line-height: 1.16;
    }

    header p:not(.eyebrow) {
      max-width: 900px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 17px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    nav a {
      padding: 9px 14px;
      color: #704433;
      background: rgba(255, 249, 238, .82);
      border: 1px solid var(--line);
      border-radius: 999px;
      text-decoration: none;
    }

    .hero-board {
      padding: 18px;
      background: rgba(255, 248, 235, .7);
      border: 1px solid rgba(255, 255, 255, .74);
      border-radius: 26px;
      box-shadow: 0 24px 80px rgba(43, 28, 16, .2);
    }

    .hero-board img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(34, 21, 12, .22);
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 20px 0 70px;
    }

    .notes article {
      padding: 16px;
      background: rgba(255, 248, 235, .76);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .notes strong {
      display: block;
      margin-bottom: 8px;
      font-size: 17px;
    }

    .notes span {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .notes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      header,
      main { width: min(100% - 20px, 1420px); }
      .hero-board { padding: 10px; border-radius: 18px; }
      .hero-board img { border-radius: 12px; }
      .notes { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Photoreal Material Output</p>
    <h1>超真实书信材质输出</h1>
    <p>这张位图按参考图重新生成：暖光桌面、墨水瓶、钢笔、横线扫描稿纸、博物馆旧信、红栏毛笔信纸。它比 CSS/矢量稿更接近真实照片和扫描件，可作为后续生成器的材质目标。</p>
    <nav>
      <a href="material-effect-generator.html">CSS 材质页</a>
      <a href="real-letter-generator.html">真实信件生成器</a>
      <a href="all-designs.html">设计总览</a>
    </nav>
  </header>

  <main>
    <section class="hero-board">
      <img src="photoreal-letter-material-board.png" alt="超真实书信材质输出">
    </section>

    <section class="notes">
      <article>
        <strong>暖光桌面</strong>
        <span>用作写信页、阅读页或导出长图的真实场景底板。</span>
      </article>
      <article>
        <strong>横线扫描稿纸</strong>
        <span>适合旧信、档案、回忆录、正式来信的扫描质感。</span>
      </article>
      <article>
        <strong>旧式红框竖排</strong>
        <span>适合民国/侨批/旧式家书方向，保留折痕和展陈感。</span>
      </article>
      <article>
        <strong>红栏毛笔近景</strong>
        <span>适合强情绪阅读页和真实信纸模板预览。</span>
      </article>
    </section>
  </main>
</body>
</html>
